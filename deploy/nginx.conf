# Web tier (Nginx). Serves the static frontend and forwards /api/* to the internal ALB.
# Replace INTERNAL_ALB_DNS with your internal load balancer's DNS name when deploying
# (for example: sed -i "s/INTERNAL_ALB_DNS/<dns-name>/" /etc/nginx/conf.d/store.conf).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # /api/products  ->  http://INTERNAL_ALB_DNS/products
    location /api/ {
        proxy_pass http://INTERNAL_ALB_DNS/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Target group health check for the external ALB
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
